name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shell-tests:
    name: entrypoint.sh tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run api() retry tests
        run: |
          set -e
          for t in tests/*.test.sh; do
            echo "== $t =="
            bash "$t"
          done
